server {
    listen 80;
    server_name bdapp.live www.bdapp.live;

    client_max_body_size 200M;
    client_body_timeout 300s;
    client_header_timeout 300s;
    keepalive_timeout 300s;
    send_timeout 300s;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Service Worker: সবসময় re-validate হবে, নইলে নতুন বিল্ড activate হয় না
    location = /service-worker.js {
        alias /var/www/bdapp/frontend/build/service-worker.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Expires "0";
        add_header Pragma "no-cache";
    }

    # STATIC_ROOT = /var/www/bdapp/staticfiles (Django collectstatic এখানে ফাইল রাখে)
    location /static/ {
        alias /var/www/bdapp/staticfiles/;
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Expires "0";
        add_header Pragma "no-cache";
    }

    location /backend-static/ {
        alias /var/www/bdapp/staticfiles/;
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Expires "0";
        add_header Pragma "no-cache";
    }

    location /media/ {
        alias /var/www/bdapp/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /api/ {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /admin/ {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # React SPA - static ফাইল আগে, তারপর index.html fallback
    location / {
        root /var/www/bdapp/frontend/build;
        index index.html index.htm;

        # index.html কখনো দীর্ঘমেয়াদে ক্যাশ করা যাবে না, নইলে ব্রাউজার পুরনো
        # hashed chunk নাম (main.xxxx.js) চাইতে থাকবে এবং সেগুলো 404 হবে।
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Expires "0";
        add_header Pragma "no-cache";

        try_files $uri $uri/ /index.html;
    }
}
