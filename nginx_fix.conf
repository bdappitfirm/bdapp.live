server {
    listen 80;
    server_name bdapp.live www.bdapp.live;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bdapp.live www.bdapp.live;

    ssl_certificate /etc/letsencrypt/live/bdapp.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bdapp.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;
    client_body_timeout 300s;
    client_header_timeout 300s;
    keepalive_timeout 300s;
    send_timeout 300s;

    location = /favicon.ico { access_log off; log_not_found off; }
    
    # Backend static files
    location /backend-static/ {
        alias /var/www/bdapp/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/bdapp/backend/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /admin {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        root /var/www/bdapp/frontend/build;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
