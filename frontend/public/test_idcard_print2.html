<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ID Card Print Test - Realistic</title>
<style>
  /* Global print styles (from index.css) */
  @media print {
    body, html {
      background-color: white !important;
      height: auto !important;
      overflow: visible !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
    }
    * {
      box-shadow: none !important;
      text-shadow: none !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
  }

  /* Print styles from SchoolDashboard (injectad as style tag) */
  @media print {
    body, html, #root {
      height: auto !important;
      overflow: visible !important;
      display: block !important;
    }
    .no-print { display: none !important; }
    main {
      display: block !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }
  }

  /* Print styles from IDCard.css */
  @media print {
    @page {
      size: A4 portrait;
      margin: 0;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background: none !important;
      width: 100% !important;
      height: auto !important;
      overflow: visible !important;
    }
    main {
      min-height: 0 !important;
      overflow: visible !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      box-sizing: border-box !important;
    }
    .id-card-generator-root {
      padding: 0 !important;
      margin: 0 !important;
      width: 100% !important;
      max-width: 100% !important;
    }
    .id-card-container {
      display: block !important;
      padding: 4mm !important;
      margin: 0 !important;
      width: 100% !important;
      max-width: 100% !important;
    }
    .id-card-container .id-card-wrapper {
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 0 4mm 0 !important;
      padding: 0 !important;
      display: block !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }
    .id-card-container .id-card-wrapper > div {
      position: relative !important;
      display: block !important;
      width: 196mm !important;
      height: 63mm !important;
      margin: 0 auto !important;
      padding: 0 !important;
      overflow: hidden !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
      background: #fff;
      border: 1px dashed #ccc;
    }
    .id-card-container .id-card-wrapper > div > .id-card-front,
    .id-card-container .id-card-wrapper > div > .id-card-back {
      position: absolute !important;
      top: 50% !important;
      width: 66.7mm !important;
      height: 386px !important;
      margin: 0 !important;
      transform: translate(-50%, -50%) rotate(90deg) scale(0.93) !important;
      transform-origin: center center !important;
      overflow: hidden !important;
      border: 2px solid #0a4b94 !important;
      border-radius: 8px !important;
      background: #fff;
    }
    .id-card-container .id-card-wrapper > div > .id-card-front { left: 48mm !important; }
    .id-card-container .id-card-wrapper > div > .id-card-back { left: 148mm !important; }
  }

  /* Screen styles - simulate MUI sx values */
  body { margin: 0; background: #eee; }
  main {
    margin-top: 72px;   /* mt: 9 from MUI */
    padding: 24px;       /* p: 3 from MUI */
    min-height: 100vh;
  }
  .id-card-generator-root {
    padding: 24px;       /* p: 3 from MUI */
  }
  .id-card-container {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    padding: 16px;
  }
  .id-card-wrapper {
    display: inline-block;
    margin: 10px;
    vertical-align: top;
  }
  .id-card-front, .id-card-back {
    width: 250px;
    height: 386px;
    border: 2px solid #0a4b94;
    border-radius: 10px;
    background: #fff;
    overflow: hidden;
  }
  .id-card-back { margin-top: 4px; }
</style>
</head>
<body>
  <main>
    <div class="print-content-wrapper">
      <div class="id-card-generator-root">
        <div class="no-print" style="padding: 24px; background: #ccc;">Header (hidden in print)</div>
        <div class="no-print" style="padding: 24px; background: #ddd;">Controls (hidden in print)</div>
        <div class="id-card-container" id="container">
          <div class="id-card-wrapper"><div>
            <div class="id-card-front">Card 1 Front</div>
            <div class="id-card-back">Card 1 Back</div>
          </div></div>
          <div class="id-card-wrapper"><div>
            <div class="id-card-front">Card 2 Front</div>
            <div class="id-card-back">Card 2 Back</div>
          </div></div>
          <div class="id-card-wrapper"><div>
            <div class="id-card-front">Card 3 Front</div>
            <div class="id-card-back">Card 3 Back</div>
          </div></div>
          <div class="id-card-wrapper"><div>
            <div class="id-card-front">Card 4 Front</div>
            <div class="id-card-back">Card 4 Back</div>
          </div></div>
        </div>
      </div>
    </div>
  </main>
<script>
  // Force print media styles to apply on screen for measurement
  const pxPerMm = 96 / 25.4;

  function measure() {
    const main = document.querySelector('main');
    const root = document.querySelector('.id-card-generator-root');
    const container = document.getElementById('container');
    const wrappers = document.querySelectorAll('.id-card-wrapper');

    const mainRect = main.getBoundingClientRect();
    const rootRect = root.getBoundingClientRect();
    const containerRect = container.getBoundingClientRect();

    console.log('=== SCREEN MEASUREMENTS ===');
    console.log('main: marginTop=' + main.style.marginTop + ', padding=' + main.style.padding);
    console.log('main rect: top=' + mainRect.top.toFixed(1) + 'px, height=' + mainRect.height.toFixed(1) + 'px');
    console.log('generator-root: padding=' + root.style.padding + ', height=' + rootRect.height.toFixed(1) + 'px');
    console.log('container: height=' + containerRect.height.toFixed(1) + 'px = ' + (containerRect.height/pxPerMm).toFixed(2) + 'mm');

    wrappers.forEach((w, i) => {
      const r = w.getBoundingClientRect();
      console.log(`Wrapper ${i+1}: top=${(r.top/pxPerMm).toFixed(2)}mm, height=${(r.height/pxPerMm).toFixed(2)}mm, bottom=${(r.bottom/pxPerMm).toFixed(2)}mm`);
    });

    const last = wrappers[wrappers.length-1].getBoundingClientRect();
    const lastBottomFromMain = (last.bottom - mainRect.top) / pxPerMm;
    console.log('Last wrapper bottom (from main top): ' + lastBottomFromMain.toFixed(2) + 'mm');
    console.log('A4 height: 297mm');
    console.log('NOTE: These are SCREEN measurements. Print overrides main margin/padding to 0.');
  }

  // Use matchMedia to detect if print styles are active
  const printQuery = window.matchMedia('print');
  console.log('Print media active?', printQuery.matches);
  measure();

  // Try to apply print styles manually for measurement
  function applyPrintStyles() {
    const main = document.querySelector('main');
    const root = document.querySelector('.id-card-generator-root');
    const container = document.getElementById('container');

    // Apply print overrides manually
    main.style.margin = '0';
    main.style.padding = '0';
    main.style.minHeight = '0';
    root.style.padding = '0';
    root.style.margin = '0';
    container.style.padding = '4mm';
    container.style.margin = '0';
    container.style.display = 'block';
    container.style.gap = '0';

    document.querySelectorAll('.no-print').forEach(el => el.style.display = 'none');

    document.querySelectorAll('.id-card-wrapper').forEach(w => {
      w.style.margin = '0 0 4mm 0';
      w.style.display = 'block';
      w.style.width = '100%';
    });

    document.querySelectorAll('.id-card-wrapper > div').forEach(d => {
      d.style.width = '196mm';
      d.style.height = '63mm';
      d.style.margin = '0 auto';
      d.style.position = 'relative';
      d.style.overflow = 'hidden';
    });

    document.querySelectorAll('.id-card-front, .id-card-back').forEach(c => {
      c.style.position = 'absolute';
      c.style.top = '50%';
      c.style.width = '66.7mm';
      c.style.height = '386px';
      c.style.transform = 'translate(-50%, -50%) rotate(90deg) scale(0.93)';
      c.style.margin = '0';
    });

    document.querySelectorAll('.id-card-front').forEach(c => c.style.left = '48mm');
    document.querySelectorAll('.id-card-back').forEach(c => c.style.left = '148mm');

    setTimeout(() => {
      console.log('\n=== AFTER APPLYING PRINT STYLES MANUALLY ===');
      const mainRect = main.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();
      const wrappers = document.querySelectorAll('.id-card-wrapper');

      console.log('main rect: top=' + mainRect.top.toFixed(1) + 'px, height=' + mainRect.height.toFixed(1) + 'px');
      console.log('container height: ' + (containerRect.height/pxPerMm).toFixed(2) + 'mm');

      wrappers.forEach((w, i) => {
        const r = w.getBoundingClientRect();
        console.log(`Wrapper ${i+1}: top=${(r.top/pxPerMm).toFixed(2)}mm, height=${(r.height/pxPerMm).toFixed(2)}mm, bottom=${(r.bottom/pxPerMm).toFixed(2)}mm`);
      });

      const last = wrappers[wrappers.length-1].getBoundingClientRect();
      const lastBottomFromMain = (last.bottom - mainRect.top) / pxPerMm;
      console.log('Last wrapper bottom (from main top): ' + lastBottomFromMain.toFixed(2) + 'mm');
      console.log('Plus container padding bottom (4mm): ' + (lastBottomFromMain + 4).toFixed(2) + 'mm');
      console.log('A4 height: 297mm');
      console.log('Fits? ' + ((lastBottomFromMain + 4) <= 297 ? 'YES' : 'NO - exceeds by ' + ((lastBottomFromMain + 4) - 297).toFixed(2) + 'mm'));
    }, 100);
  }

  setTimeout(applyPrintStyles, 200);
</script>
</body>
</html>
